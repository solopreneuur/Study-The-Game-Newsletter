<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study the Game</title>
<meta name="description" content="5 ideas worth stealing, hand-picked every Sunday.">
<meta name="theme-color" content="#f7eedd">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Caveat:wght@500..700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <div class="masthead-row">
      <a class="wordmark" href="/">Study the Game</a>
      <span class="hand" id="meta"></span>
    </div>
    <svg class="squiggle" viewBox="0 0 220 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 5 C 25 9, 40 1, 62 6 S 95 9, 120 4 S 160 2, 182 7 S 206 4, 218 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </header>
  <article id="issue"></article>
  <footer class="foot"><svg class="squiggle" viewBox="0 0 220 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 5 C 25 9, 40 1, 62 6 S 95 9, 120 4 S 160 2, 182 7 S 206 4, 218 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Study the Game · every Sunday</span><button type="button" data-open-signup>Subscribe</button></footer>
</main>

<button class="btn subscribe-fab" type="button" data-open-signup>Subscribe</button>

<div class="modal" id="signup" role="dialog" aria-modal="true" aria-labelledby="signup-title" hidden>
  <div class="modal-card">
    <button class="modal-close" id="close-signup" type="button" aria-label="Close">✕</button>
    <div id="signup-body">
      <h2 id="signup-title">5 ideas worth <mark>stealing</mark></h2>
      <form id="signup-form" novalidate>
        <input id="signup-email" aria-label="Email address" type="email" name="fields[email]" placeholder="you@email.com" autocomplete="email" required>
        <input type="hidden" name="ml-submit" value="1">
        <input type="hidden" name="anticsrf" value="true">
        <button class="btn" type="submit">Get it every Sunday</button>
        <div class="form-note" id="form-note" aria-live="polite"></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="app.js"></script>
<script>
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
// MailerLite embedded form tied to the "Study the Game Newsletter" group.
var ML_FORM_ACTION = "https://assets.mailerlite.com/jsonp/2555674/forms/201535056716498357/subscribe";

(function () {
  var KEY = "stg-signup-done";
  var modal = document.getElementById("signup");
  var body = document.getElementById("signup-body");
  var form = document.getElementById("signup-form");
  var note = document.getElementById("form-note");
  var email = document.getElementById("signup-email");
  var submit = form.querySelector('button[type="submit"]');

  function remember() { try { localStorage.setItem(KEY, "1"); } catch (e) {} }
  function seen() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }

  function open() { modal.hidden = false; email && email.focus(); }
  function close() { modal.hidden = true; remember(); }

  document.querySelectorAll("[data-open-signup]").forEach(function (b) { b.addEventListener("click", open); });
  document.getElementById("close-signup").addEventListener("click", close);
  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) close(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!email.value || !email.checkValidity()) { note.textContent = "Enter a valid email."; return; }
    submit.disabled = true;
    note.textContent = "";
    fetch(ML_FORM_ACTION, { method: "POST", mode: "no-cors", body: new FormData(form) })
      .then(function () {
        remember();
        body.innerHTML = '<div class="done"><h2>You’re in.</h2></div>';
        setTimeout(function () { modal.hidden = true; }, 3200);
      })
      .catch(function () {
        submit.disabled = false;
        note.textContent = "Something went wrong. Try again.";
      });
  });

  if (!seen()) open();
})();
</script>
</body>
</html>
